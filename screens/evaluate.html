<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluar — Sistema Docente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../app.css" />
  <style>
    .eval-grid { display: grid; gap: 16px; }
    .eval-item {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .eval-item h4 { font: 500 14px/1.2 var(--font-display); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .eval-item .desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .eval-item .desc-detalle {
      font-size: 11.5px; color: var(--muted); line-height: 1.5;
      padding: 8px 10px; background: var(--surface);
      border-radius: 6px; border: 1px solid var(--border);
      display: none; margin-bottom: 10px;
    }
    .eval-item .desc-detalle.visible { display: block; }
    .eval-item .desc-detalle strong { color: var(--fg); }
    .level-select { display: flex; gap: 8px; }
    .level-select label {
      flex: 1; text-align: center; padding: 8px;
      border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-size: 12px; font-weight: 500;
      transition: all 0.12s; background: var(--surface);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .level-select input { display: none; }
    .level-select input:checked + label[data-level="initiated"] { border-color: var(--danger); background: oklch(55% 0.18 25 / 0.06); color: var(--danger); }
    .level-select input:checked + label[data-level="progress"] { border-color: var(--warning); background: oklch(65% 0.14 85 / 0.06); color: var(--warning); }
    .level-select input:checked + label[data-level="achieved"] { border-color: var(--success); background: oklch(55% 0.15 145 / 0.06); color: var(--success); }
    .btn-detalle {
      font-size: 11px; color: var(--muted);
      background: none; border: none; cursor: pointer;
      text-decoration: underline dotted; padding: 0;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-detalle:hover { color: var(--accent); }
    .summary-bar { display: flex; gap: 16px; margin-bottom: 20px; }
    .summary-stat { flex: 1; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); text-align: center; }
    .summary-stat .count { font: 600 18px/1 var(--font-display); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .summary-stat .count i { font-size: 12px; }
    .summary-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .summary-stat .count.danger  { color: var(--danger); }
    .summary-stat .count.warning { color: var(--warning); }
    .summary-stat .count.success { color: var(--success); }
    .unit-selector { padding: 6px 10px; font-size: 12.5px; max-width: 320px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>
    <div class="main-area">
      <div class="topbar">
        <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-left">
          <a href="dashboard.html" id="backLink" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> <span id="backLabel">Grupo</span></a>
          <h2><i class="fa-solid fa-clipboard-check" style="color:var(--accent);margin-right:8px"></i>Evaluar alumno</h2>
        </div>
        <div class="topbar-actions" style="display:flex; gap:8px; align-items:center;">
          <select id="unitSelector" class="unit-selector" title="Unidad"></select>
          <select id="taskSelector" class="unit-selector" title="Tarea"></select>
        </div>
      </div>
      <div class="content" style="max-width:760px">
        <div class="bc" id="breadcrumb"></div>
        <div class="card" style="margin-bottom:20px" id="studentCard"></div>
        <div class="summary-bar" id="summaryBar"></div>
        <form id="evalForm">
          <div class="eval-grid" id="evalGrid"></div>
          <div class="card" style="margin-top:20px">
            <div class="form-group">
              <label><i class="fa-solid fa-comment" style="color:var(--accent);margin-right:6px"></i>Observaciones adicionales</label>
              <textarea name="observations" placeholder="Notas sobre el desempeño del alumno en esta evaluación..." style="min-height:90px"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Guardar evaluación</button>
              <a id="monLink" class="btn"><i class="fa-solid fa-file-lines"></i> Ficha de monitoreo</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../help.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { renderSidebar } from '../js/views/sidebar.js';
    import { escapeHtml }    from '../js/core/dom.js';

    const params = new URLSearchParams(window.location.search);
    const studentId = params.get('alumno');
    if (!studentId) window.location.href = 'dashboard.html';

    const CRITERIA = [
      { key: 'clasificacion', label: 'Clasificación de información',
        desc: 'Capacidad para agrupar y organizar información según atributos compartidos',
        detalle: { I: 'No distingue entre categorías; no relaciona características comunes.', EP: 'Identifica categorías básicas con apoyo; reconoce algunas características diferenciadoras.', L: 'Clasifica de forma independiente; justifica agrupaciones con características claras.' } },
      { key: 'seriacion', label: 'Seriación y ordenamiento',
        desc: 'Habilidad para establecer secuencias y patrones ordenados',
        detalle: { I: 'No organiza elementos en secuencia lógica; desconoce orden de eventos.', EP: 'Organiza secuencias simples con modelo guía; comete errores en pasos intermedios.', L: 'Ordena eventos complejos sin modelo; explica el criterio de secuenciación utilizado.' } },
      { key: 'construccion', label: 'Construcción de conocimiento',
        desc: 'Capacidad para integrar nueva información con conocimientos previos',
        detalle: { I: 'No vincula nuevos aprendizajes con experiencias previas.', EP: 'Relaciona conceptos con apoyo del docente.', L: 'Integra conocimientos de forma autónoma; transfiere aprendizajes a contextos diferentes.' } },
      { key: 'pensamiento', label: 'Pensamiento lógico',
        desc: 'Habilidad para establecer relaciones causa-efecto y resolver problemas',
        detalle: { I: 'No puede explicar sus decisiones; respuestas aleatorias.', EP: 'Ofrece justificaciones simples, ligadas a características observables.', L: 'Argumenta sus elecciones con razonamientos lógicos.' } },
      { key: 'metacognicion', label: 'Metacognición',
        desc: 'Capacidad para reflexionar sobre el propio proceso de aprendizaje',
        detalle: { I: 'No se da cuenta de sus errores; no reflexiona sobre su proceso.', EP: 'Reconoce errores cuando se le señalan; realiza preguntas básicas.', L: 'Reflexiona sobre su proceso; corrige errores de forma independiente.' } }
    ];

    let currentUnitId = null;
    let currentTaskId = null;

    function init() {
      if (!window.App) { setTimeout(init, 50); return; }
      if (!window.App.auth.isLoggedIn()) { window.location.href = 'login.html'; return; }
      renderSidebar(document.getElementById('sidebar'), 'dashboard');
      render();
      window.App.bus.on(window.App.EVENTS.EVALS_CHANGED, render);

      document.getElementById('unitSelector').addEventListener('change', function () {
        currentUnitId = this.value;
        currentTaskId = null; // Reset task when unit changes
        render();
      });
      document.getElementById('taskSelector').addEventListener('change', function () {
        currentTaskId = this.value;
        render();
      });
      document.getElementById('evalForm').addEventListener('submit', submitForm);
    }

    function render() {
      const s = window.App.students.get(studentId);
      if (!s) { window.location.href = 'dashboard.html'; return; }
      const g = window.App.groups.get(s.groupId);
      const initials = s.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
      document.title = `Evaluar a ${s.name} — Sistema Docente`;

      // Selector de unidad
      const availableUnits = window.App.units.list().filter(u => (u.groupIds || []).includes(s.groupId) && u.status === 'active');
      if (!currentUnitId || !availableUnits.find(u => u.id === currentUnitId)) {
        currentUnitId = availableUnits.length ? availableUnits[0].id : null;
      }
      const sel = document.getElementById('unitSelector');
      sel.innerHTML = availableUnits.length
        ? availableUnits.map(u => `<option value="${u.id}" ${u.id===currentUnitId?'selected':''}>${escapeHtml(u.name)}</option>`).join('')
        : '<option>— sin unidades activas —</option>';

      // Selector de Tarea
      const availableTasks = currentUnitId ? window.App.tasks.byUnit(currentUnitId) : [];
      if (!currentTaskId || !availableTasks.find(t => t.id === currentTaskId)) {
        currentTaskId = availableTasks.length ? availableTasks[0].id : null;
      }
      const tsel = document.getElementById('taskSelector');
      tsel.innerHTML = availableTasks.length
        ? availableTasks.map(t => `<option value="${t.id}" ${t.id===currentTaskId?'selected':''}>${escapeHtml(t.title)}</option>`).join('')
        : '<option value="">— sin tareas —</option>';

      // Cabecera
      document.getElementById('studentCard').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:50%;background:var(--accent-muted);color:var(--accent);display:grid;place-items:center;font-weight:600">${escapeHtml(initials)}</div>
          <div style="flex:1">
            <div style="font-weight:500">${escapeHtml(s.name)}</div>
            <div style="font-size:12px;color:var(--muted)">${escapeHtml(g ? g.name : '—')} · ${availableUnits.find(u => u.id === currentUnitId) ? escapeHtml(availableUnits.find(u => u.id === currentUnitId).name) : 'Sin unidad'} · ${availableTasks.find(t => t.id === currentTaskId) ? escapeHtml(availableTasks.find(t => t.id === currentTaskId).title) : 'Sin tarea'}</div>
          </div>
        </div>
      `;
      document.getElementById('breadcrumb').innerHTML = `
        <a class="bc-link" href="dashboard.html"><i class="fa-solid fa-house bc-icon"></i> Inicio</a>
        <span class="bc-sep"><i class="fa-solid fa-chevron-right bc-icon"></i></span>
        <a class="bc-link" href="group.html?grupo=${s.groupId}">${escapeHtml(g ? g.name : 'Grupo')}</a>
        <span class="bc-sep"><i class="fa-solid fa-chevron-right bc-icon"></i></span>
        <span class="bc-current">Evaluar a ${escapeHtml(s.name)}</span>
      `;
      document.getElementById('backLink').href = 'group.html?grupo=' + s.groupId;
      document.getElementById('backLabel').textContent = g ? g.name : 'Grupo';
      document.getElementById('monLink').href = 'monitoring.html?alumno=' + s.id;

      // Cargar evaluación previa (si existe) para pre-llenar
      const prev = currentTaskId ? window.App.evaluations.byStudent(studentId).find(e => e.taskId === currentTaskId) : null;
      const prevC = (prev && prev.criteria) || {};
      const prevObs = prev ? prev.observations : '';

      // Render criterios
      const grid = document.getElementById('evalGrid');
      grid.innerHTML = CRITERIA.map((c, i) => {
        const v = prevC[c.key] || 'EP';
        return `
          <div class="eval-item">
            <h4>
              <i class="fa-solid fa-${i+1}" style="color:var(--accent)"></i>
              ${escapeHtml(c.label)}
              <button type="button" class="btn-detalle" data-detalle="${c.key}">
                <i class="fa-solid fa-circle-info"></i> Ver rúbrica
              </button>
            </h4>
            <div class="desc">${escapeHtml(c.desc)}</div>
            <div class="desc-detalle" id="detalle-${c.key}">
              <strong>Iniciado (I):</strong> ${c.detalle.I}<br />
              <strong>En Proceso (EP):</strong> ${c.detalle.EP}<br />
              <strong>Logrado (L):</strong> ${c.detalle.L}
            </div>
            <div class="level-select" data-criterion="${c.key}">
              <input type="radio" name="${c.key}" id="${c.key}-i"  value="I"  ${v==='I'?'checked':''}/>
              <label for="${c.key}-i"  data-level="initiated"><i class="fa-solid fa-circle-dot"></i> Iniciado (I)</label>
              <input type="radio" name="${c.key}" id="${c.key}-ep" value="EP" ${v==='EP'?'checked':''}/>
              <label for="${c.key}-ep" data-level="progress"><i class="fa-solid fa-circle-half-stroke"></i> En Proceso (EP)</label>
              <input type="radio" name="${c.key}" id="${c.key}-l"  value="L"  ${v==='L'?'checked':''}/>
              <label for="${c.key}-l"  data-level="achieved"><i class="fa-solid fa-circle-check"></i> Logrado (L)</label>
            </div>
          </div>
        `;
      }).join('');

      // Pre-llenar observaciones
      const obs = document.querySelector('[name=observations]');
      if (obs) obs.value = prevObs;

      // Resumen
      document.getElementById('summaryBar').innerHTML = `
        <div class="summary-stat"><div class="count danger" id="countI">0</div><div class="lbl">Iniciado (I)</div></div>
        <div class="summary-stat"><div class="count warning" id="countEP">0</div><div class="lbl">En Proceso (EP)</div></div>
        <div class="summary-stat"><div class="count success" id="countL">0</div><div class="lbl">Logrado (L)</div></div>
      `;
      updateSummary();

      // Listeners
      document.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener('change', updateSummary));
      grid.querySelectorAll('.btn-detalle').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.getAttribute('data-detalle');
          const d = document.getElementById('detalle-' + k);
          d.classList.toggle('visible');
          btn.innerHTML = d.classList.contains('visible')
            ? '<i class="fa-solid fa-eye-slash"></i> Ocultar rúbrica'
            : '<i class="fa-solid fa-circle-info"></i> Ver rúbrica';
        });
      });
    }

    function updateSummary() {
      const radios = document.querySelectorAll('.level-select input[type="radio"]:checked');
      let I=0, EP=0, L=0;
      radios.forEach(r => { if (r.value==='I') I++; else if (r.value==='EP') EP++; else if (r.value==='L') L++; });
      document.getElementById('countI').textContent  = I;
      document.getElementById('countEP').textContent = EP;
      document.getElementById('countL').textContent  = L;
    }

    function submitForm(e) {
      e.preventDefault();
      if (!currentUnitId) {
        window.App.toast({ type: 'error', title: 'Sin unidad', message: 'Este grupo no tiene unidades activas.' });
        return;
      }
      if (!currentTaskId) {
        window.App.toast({ type: 'error', title: 'Sin tarea', message: 'Debes seleccionar una tarea para evaluar.' });
        return;
      }
      const criteria = {};
      CRITERIA.forEach(c => {
        const sel = document.querySelector(`input[name="${c.key}"]:checked`);
        if (sel) criteria[c.key] = sel.value;
      });
      const observations = document.querySelector('[name=observations]').value.trim();
      const r = window.App.evaluations.save({ studentId, unitId: currentUnitId, taskId: currentTaskId, criteria, observations });
      if (!r.ok) { window.App.toast({ type: 'error', title: 'Error', message: r.error || 'No se pudo guardar' }); return; }
      window.App.toast({ type: 'success', title: '¡Evaluación guardada!', message: '5 criterios registrados correctamente.' });
    }

    init();
  </script>
</body>
</html>
